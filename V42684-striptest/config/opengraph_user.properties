#OpenGraph user settings
# Projection settings are profile-specific. The active profile follows structure.type.
structure.type=2
defaults.profile=opengraph

# Legacy/global fallback keys. Profile keys below override these.
projections.show=true
projection.left.enabled=true
projection.right.enabled=true
projection.top.enabled=true
projection.bottom.enabled=true
projection.left.caption=LEX
projection.right.caption=SYNT
projection.top.caption=pm
projection.bottom.caption=LF

# Projection profile: Simple tree -- no projections.
projection.profile.simple.show=false
projection.profile.simple.left.enabled=false
projection.profile.simple.right.enabled=false
projection.profile.simple.top.enabled=false
projection.profile.simple.bottom.enabled=false
projection.profile.simple.left.caption=
projection.profile.simple.right.caption=
projection.profile.simple.top.caption=
projection.profile.simple.bottom.caption=
projection.profile.simple.left.position=2
projection.profile.simple.right.position=30
projection.profile.simple.top.position=2
projection.profile.simple.bottom.position=30

# Projection profile: Dutch Language Tree / Phrase.
# LEX is left, SYNT is right, pm is above, LF is below.
projection.profile.language.show=true
projection.profile.language.left.enabled=true
projection.profile.language.right.enabled=true
projection.profile.language.top.enabled=true
projection.profile.language.bottom.enabled=true
projection.profile.language.left.caption=LEX
projection.profile.language.right.caption=SYNT
projection.profile.language.top.caption=pm
projection.profile.language.bottom.caption=LF
projection.profile.language.left.position=2
projection.profile.language.right.position=30
projection.profile.language.top.position=2
projection.profile.language.bottom.position=30

# Projection profile: Frame / roles-functions.
# Frame is projection-capable, but does not reuse the Language Tree SYNT/LF profile.
projection.profile.frame.show=true
projection.profile.frame.left.enabled=true
projection.profile.frame.right.enabled=true
projection.profile.frame.top.enabled=true
projection.profile.frame.bottom.enabled=false
projection.profile.frame.left.caption=LEX
projection.profile.frame.right.caption=ROLE
projection.profile.frame.top.caption=FRAME
projection.profile.frame.bottom.caption=SEM
projection.profile.frame.left.position=2
projection.profile.frame.right.position=30
projection.profile.frame.top.position=2
projection.profile.frame.bottom.position=30


# Projection profile: Functional Tree / role-box.
# FT uses role order for functional labels such as pred, agens, patiens, recipiens.
projection.profile.functional.show=true
projection.profile.functional.left.enabled=true
projection.profile.functional.right.enabled=true
projection.profile.functional.top.enabled=true
projection.profile.functional.bottom.enabled=false
projection.profile.functional.left.caption=LEX
projection.profile.functional.right.caption=ROLE
projection.profile.functional.top.caption=FT
projection.profile.functional.bottom.caption=SEM
projection.profile.functional.left.position=2
projection.profile.functional.right.position=30
projection.profile.functional.top.position=2
projection.profile.functional.bottom.position=30
projection.profile.functional.layout.strategy=role_box
functional.layout.strategy=role_box

# Projection profile: Anafoor.
projection.profile.anaphor.show=true
projection.profile.anaphor.left.enabled=true
projection.profile.anaphor.right.enabled=true
projection.profile.anaphor.top.enabled=true
projection.profile.anaphor.bottom.enabled=false
projection.profile.anaphor.left.caption=LEX
projection.profile.anaphor.right.caption=ANA
projection.profile.anaphor.top.caption=pm
projection.profile.anaphor.bottom.caption=LF
projection.profile.anaphor.left.position=2
projection.profile.anaphor.right.position=32
projection.profile.anaphor.top.position=2
projection.profile.anaphor.bottom.position=34

# Projection profile: fallback for later structure types.
projection.profile.default.show=true
projection.profile.default.left.enabled=true
projection.profile.default.right.enabled=true
projection.profile.default.top.enabled=false
projection.profile.default.bottom.enabled=false
projection.profile.default.left.caption=LEX
projection.profile.default.right.caption=PROJ
projection.profile.default.top.caption=pm
projection.profile.default.bottom.caption=LF
projection.profile.default.left.position=2
projection.profile.default.right.position=30
projection.profile.default.top.position=2
projection.profile.default.bottom.position=30

# Common placement of the open structure in grid units.
structure.offset.left=2
structure.offset.top=2

# Legacy/global projection band positions. Profile positions override these.
projection.left.position=2
projection.right.position=30
projection.top.position=2
projection.bottom.position=30

grid.column.width=20
grid.row.height=20
grid.mode=2
grid.fit.scope=3
grid.margin.left=2
grid.margin.right=2
grid.margin.top=2
grid.margin.bottom=2

# Language Tree V-cluster order: pv_vd = heeft gebeten; vd_pv = gebeten heeft
language.verbcluster.order=pv_vd
projection.profile.language.verbcluster.order=pv_vd
# Language Tree layout strategy.
# projection_box = projectiegestuurde n-ary box-layout: projection order first, local box first.
# nary_compact_lr = previous n-binair/n-ary compact LR/RL alias.
# free_d_lite = previous D-lite fallback.
language.layout.strategy=projection_box
projection.profile.language.layout.strategy=projection_box
language.layout.nary.mode=projection_box
language.layout.nary.localShapeFirst=true
language.layout.nary.preserveProjectionOrder=true

