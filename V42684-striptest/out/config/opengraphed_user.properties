# OpenGraphEd user settings
# Keep GRAPH chooser away from config/ test files by default.
graph.load.from.default.dir=true
graph.default.dir=examples/graph
opn.load.from.default.dir=true
opn.default.dir=examples/opn

language.layout.nary.mode=projection_box
language.layout.nary.localShapeFirst=true
language.layout.nary.preserveProjectionOrder=true

