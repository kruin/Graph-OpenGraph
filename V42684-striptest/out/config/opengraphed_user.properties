# Projection profile: Functional Tree / role-box.
# FT uses role order for functional labels such as pred, agens, patiens, recipiens.
projection.profile.functional.show=true
projection.profile.functional.left.enabled=true
projection.profile.functional.right.enabled=true
projection.profile.functional.top.enabled=true
projection.profile.functional.bottom.enabled=false
projection.profile.functional.left.caption=LEX
projection.profile.functional.right.caption=ROLE
projection.profile.functional.top.caption=FT
projection.profile.functional.bottom.caption=SEM
projection.profile.functional.left.position=2
projection.profile.functional.right.position=30
projection.profile.functional.top.position=2
projection.profile.functional.bottom.position=30
projection.profile.functional.layout.strategy=role_box
functional.layout.strategy=role_box


# v4.25.6 Functional Tree role-box configuration.
# These properties are read only by FT/role_box; LT remains projection_box.
functional.layout.role.pred.rank=0
functional.layout.role.pred.side=center
functional.layout.role.pred.corridor=auto
functional.layout.role.agens.rank=10
functional.layout.role.agens.side=left
functional.layout.role.agens.corridor=outer
functional.layout.role.patiens.rank=20
functional.layout.role.patiens.side=right
functional.layout.role.patiens.corridor=outer
functional.layout.role.recipiens.rank=30
functional.layout.role.recipiens.side=right
functional.layout.role.recipiens.corridor=inner
functional.layout.role.instrument.rank=40
functional.layout.role.instrument.side=down
functional.layout.role.instrument.corridor=stack
functional.layout.role.locatief.rank=50
functional.layout.role.locatief.side=down
functional.layout.role.locatief.corridor=stack
functional.layout.role.tijd.rank=60
functional.layout.role.tijd.side=down
functional.layout.role.tijd.corridor=stack

# v4.26.1 temporary Functional Tree diagnostics
functional.layout.debug=false
functional.layout.downStack.minClearanceX=4
functional.layout.downStack.startBelowFullBox=true

# v4.26.2: keep down-stack edges out of the predicate edge cone.
functional.layout.downStack.edgeConeClearance=3

functional.layout.downStack.mode=adjunct_stack
functional.layout.downStack.anchor=pred
functional.layout.downStack.xOffset=2
functional.layout.downStack.verticalGap=2

# v4.26.8 Functional Tree role selection / Frame preparation
# core = kept in compact FT role-box; frame = reserved for FRAME projection/later frame view.
functional.layout.coreRoles=pred,proces,action,event,actor,agens,patiens,thema,recipiens,ontvanger,ervaarder,voeler,fenomeen,zegger,bewoording,gedrager,bestaande,beneficient,beneficiënt,doel,gever,nemer
functional.layout.frameRoles=frame,richting,bron,plaats,locatief,locatie,tijd,tijdsduur,manier,instrument,oorzaak,reden,motief,eigenschap,natuurlijke oorzaak
functional.layout.role.pred.scope=core
functional.layout.role.pred.visible=true
functional.layout.role.agens.scope=core
functional.layout.role.agens.visible=true
functional.layout.role.patiens.scope=core
functional.layout.role.patiens.visible=true
functional.layout.role.recipiens.scope=core
functional.layout.role.recipiens.visible=true
functional.layout.role.instrument.scope=frame
functional.layout.role.instrument.visible=false
functional.layout.role.locatief.scope=frame
functional.layout.role.locatief.visible=false
functional.layout.role.plaats.scope=frame
functional.layout.role.plaats.visible=false
functional.layout.role.tijd.scope=frame
functional.layout.role.tijd.visible=false
functional.layout.frame.enabled=true
functional.layout.frame.caption=FRAME
functional.layout.frame.roles=instrument,locatief,plaats,tijd

